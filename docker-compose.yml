services:
  backend:
    build:
      context: .
      dockerfile: SharpbinV3.Server/Dockerfile
    image: sharpbin-backend
    container_name: sharpbin-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/sharpbin.db"
      ASPNETCORE_URLS: "http://+:8080"
    volumes:
      - sharpbin-data:/app/data
      - ./SharpbinV3.Server/appsettings.json:/app/appsettings.json
    networks:
      - sharpbin-net
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./SharpbinV3.Client
      dockerfile: Dockerfile
    image: sharpbin-frontend
    container_name: sharpbin-frontend
    environment:
      VITE_API_URL: http://backend:8080
    ports:
      - "5173:5173"
    networks:
      - sharpbin-net
    restart: unless-stopped

volumes:
  sharpbin-data:


networks:
  sharpbin-net:
    driver: bridge

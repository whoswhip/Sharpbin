services:
  backend:
    build:
      context: ./SharpbinV3.Server
      dockerfile: Dockerfile
    image: sharpbin-backend
    container_name: sharpbin-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SQLITE_CONN: "Data Source=/app/data/sharpbin.db"
    volumes:
      - sharpbin-data:/app/data
    networks:
      - sharpbin-net
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./SharpbinV3.Client
      dockerfile: Dockerfile
    image: sharpbin-frontend
    container_name: sharpbin-frontend
    environment:
      VITE_API_URL: http://backend:8080
    ports:
      - "5173:5173"
    networks:
      - sharpbin-net
    restart: unless-stopped

volumes:
  sharpbin-data:

networks:
  sharpbin-net:
    driver: bridge

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #171717;
            border: 2px solid #262626;
            border-radius: 8px;
            overflow: hidden;
        }
        .header {
            background-color: #171717;
            padding: 32px 30px;
            border-bottom: 1px solid #262626;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }
        .content {
            padding: 32px 30px;
        }
        .content h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }
        .content p {
            margin: 0 0 16px 0;
            font-size: 15px;
            line-height: 1.6;
            color: #d4d4d4;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #404040;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 15px;
            margin: 12px 0;
        }
        .button:hover {
            background-color: #525252;
        }
        .link-box {
            background-color: #262626;
            padding: 16px;
            border-radius: 6px;
            margin: 16px 0;
            word-break: break-all;
        }
        .link-box a {
            color: #3b82f6;
            text-decoration: underline;
            font-size: 14px;
        }
        .footer {
            padding: 24px 30px;
            text-align: center;
            background-color: #0a0a0a;
            border-top: 1px solid #262626;
        }
        .footer p {
            margin: 0 0 8px 0;
            font-size: 13px;
            color: #737373;
        }
        .footer .brand {
            font-weight: 600;
            color: #ffffff;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sharpbin</h1>
        </div>
        <div class="content">
            {{CONTENT}}
        </div>
        <div class="footer">
            <p class="brand">Sharpbin</p>
            <p>This is an automated email. Please do not reply to this message.</p>
        </div>
    </div>
</body>
</html>

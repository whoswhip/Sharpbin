<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading - Sharpbin</title>
    <link rel="preload" href="/css/style.css" as="style">
    <link rel="preload" href="/css/user.css" as="style">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/user.css">
    <link rel="preload" href="/js/user.js" as="script">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Mono:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main-container">
        <div class="user-header">
            <h1 id="user-name">Loading...</h1>
            <p id="user-uuid"></p>
        </div>
        <div class="user-pastes-section">
            <div class="archive-information">
                <p id="archive-title">Title</p>
                <p id="archive-date">Date</p>
                <p id="archive-syntax">Syntax</p>
            </div>
            <ul id="user-pastes-list" class="archive-list">
                <div class="user-pastes-throbber throbber"></div>
            </ul>
            <div class="pastes-actions">
                <button id="previous-button"><span id="previous-button-svg"></span></button>
                <p id="paste-pages">0/0</p>
                <button id="next-button"><span id="next-button-svg"></span></button>
            </div>
        </div>
    </div>
</body>
<script src="/js/user.js"></script>
<script src="/js/main.js"></script>

</html>

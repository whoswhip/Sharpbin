<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sharpbin</title>
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="css/auth.css" as="style">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="auth-container">
        <div class="auth-form-container">
            <h1 class="auth-title">Login to Sharpbin</h1>
            <div id="error-message" class="error-message"></div>
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="username">Username or Email</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="auth-button">Login</button>
            </form>            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Register</a></p>
                <p>Forgot your password? <a href="reset-password.html">Reset Password</a></p>
                <p><a href="/">Back to Home</a></p>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
